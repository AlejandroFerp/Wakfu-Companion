<!doctype html><meta charset="utf-8"><title>Prueba de autor ambiguo</title>
<script>localStorage.removeItem('wakfu_fight_history');localStorage.removeItem('wakfu_live_combat_state');localStorage.removeItem('wakfu_overrides');</script>
<iframe id="app" src="../public/index.html" width="1000" height="600"></iframe><p id="result">Comprobando...</p>
<script>
document.getElementById('app').onload=async()=>{
  const app=document.getElementById('app').contentWindow,result=document.getElementById('result');
  try{
    app.saveFileHandleToDB=async()=>{};let content='';
    const handle={name:'wakfu_chat.log',async getFile(){return new File([content],'wakfu_chat.log');}};
    const drop=new app.Event('drop',{bubbles:true,cancelable:true});
    Object.defineProperty(drop,'dataTransfer',{value:{items:[{kind:'file',async getAsFileSystemHandle(){return handle;}}]}});
    app.document.getElementById('drop-zone').dispatchEvent(drop);await new Promise(r=>setTimeout(r,200));
    content=['12:00:00,000 - [Información (combate)] Uno lanza el hechizo Piratería.',
      '12:00:00,500 - [Información (combate)] Tercero lanza el hechizo Hechizo desconocido.',
      '12:00:00,600 - [Información (combate)] Objetivo: -30 PdV (agua) (Piratería)',
      '12:00:01,000 - [Información (combate)] Dos lanza el hechizo Piratería.',
      '12:00:02,000 - [Información (combate)] Tercero lanza el hechizo Hechizo desconocido.',
      '12:00:03,000 - [Información (combate)] Objetivo: -100 PdV (agua) (Piratería)',
      '12:00:04,000 - [Información (combate)] Uno lanza el hechizo Piratería.',
      '12:00:05,000 - [Información (combate)] Objetivo: -50 PdV (agua)',''].join('\n');
    await app.parseFile();
    const d=app.document, unknown=d.getElementById('list-unknown');
    const unknownRow=[...unknown.querySelectorAll('.player-block')].find(row=>row.dataset.name==='Autor desconocido');
    const one=[...d.querySelectorAll('.player-block')].find(row=>row.dataset.name==='Uno');
    if(!unknownRow || unknownRow.querySelector('.player-total').textContent!=='130') throw Error('El daño ambiguo se adjudicó a un personaje sin pruebas');
    if(!one || one.querySelector('.player-total').textContent!=='50') throw Error('El lanzamiento observado se atribuyó incorrectamente');
    result.textContent='PRUEBA CORRECTA';
  }catch(error){result.textContent='PRUEBA FALLIDA: '+error.message;}
};
</script>
