<!doctype html><meta charset="utf-8"><title>Prueba del registro de combate</title>
<iframe id="app" src="../public/index.html" width="1200" height="750"></iframe>
<p id="result">Comprobando...</p>
<script>
document.getElementById('app').onload = async () => {
  const app = document.getElementById('app').contentWindow;
  const result = document.getElementById('result');
  try {
    app.saveFileHandleToDB = async () => {};
    let content = '';
    const handle = { name: 'wakfu_chat.log', async getFile() { return new File([content], 'wakfu_chat.log'); } };
    const drop = new app.Event('drop', { bubbles: true, cancelable: true });
    Object.defineProperty(drop, 'dataTransfer', { value: { items: [{ kind: 'file', async getAsFileSystemHandle() { return handle; } }] } });
    app.document.getElementById('drop-zone').dispatchEvent(drop);
    await new Promise(resolve => setTimeout(resolve, 200));
    const hyper = app.document.getElementById('hyper-character');
    app.detectClass('HipermagoEjemplo', 'Orbes Relucientes');
    if (hyper.value !== 'HipermagoEjemplo' || !app.document.getElementById('hyper-choice-label').hidden) throw Error('No se detectó el hipermago automáticamente');
    app.detectClass('Segundo', 'Orbes Relucientes');
    if (hyper.value !== 'HipermagoEjemplo' || app.document.getElementById('hyper-choice-label').hidden) throw Error('Selección de varios hipermagos incorrecta');
    content = [
      '12:00:00,000 - [Información (combate)] Personaje lanza el hechizo Piratería. (Crítico)',
      '12:00:01,000 - [Información (combate)] Objetivo: -1.234 PdV (fuego)',
      '12:00:02,000 - [Información (combate)] Personaje: -2 PM',
      '12:00:03,000 - [Información (combate)] Personaje: Escudo (+1 niv.)',
      '12:00:03,500 - [Información (combate)] Objetivo: -30 PdV (daño por la espalda)',
      '12:00:03,600 - [Información (combate)] Personaje: Invoca un(a) Torreta',
      '12:00:03,700 - [Información (combate)] Objetivo: es empujado 3 casillas',
      '12:00:03,800 - [Información (combate)] HipermagoEjemplo: Abundancia (+50 niv.) (Plenitud)',
      '12:00:03,900 - [Información (combate)] HipermagoEjemplo: Abundancia (+60 niv.) (Runa consumida)',
      '12:00:03,950 - [Información (combate)] HipermagoEjemplo: 25 BC (Runa generada)',
      '12:00:03,955 - [Información (combate)] 67 segundos devueltos para el siguiente turno.',
      '12:00:03,960 - [Información (combate)] HipermagoEjemplo lanza el hechizo Ciclo Elemental.',
      '12:00:03,970 - [Información (combate)] Objetivo: Luminiscencia (Niv. 1) (Runas consumidas)',
      "12:00:03,980 - [Información (combate)] [HipermagoEjemplo] Fuego fatuo: Guardado Incan'runa",
      "12:00:03,990 - [Información (combate)] HipermagoEjemplo: Incan'runa (Niv. 1) (Corazón Incandescente)",
      '12:00:04,000 - [Comercio] Mensaje privado de prueba',
      ''
    ].join('\n');
    await app.parseFile();
    const settings = app.document.getElementById('class-settings-toggle');
    settings.click();
    if (settings.getAttribute('aria-expanded') !== 'true') throw Error('No se abrieron los ajustes');
    settings.click();
    if (settings.getAttribute('aria-expanded') !== 'false') throw Error('No se cerraron los ajustes');
    if (!app.document.getElementById('hyper-target').hidden) throw Error('El selector de objetivo debe permanecer oculto');
    const list = app.document.getElementById('combat-log-list');
    const rows = [...list.querySelectorAll('.combat-log-event')];
    if (rows.length !== 15 || rows.map(x => x.dataset.type).join(',') !== 'cast,damage,resource,state,damage,summon,movement,state,state,resource,other,cast,state,other,state') throw Error('Eventos o categorías incorrectos');
    if (app.document.getElementById('hyper-start-turn') || app.document.querySelector('#hyper-observations .class-note') || /espalda/i.test(app.document.getElementById('hyper-observations').textContent)) throw Error('La tarjeta muestra elementos retirados');
    if (app.document.getElementById('class-tracker-content').classList.contains('is-turn-estimated') || app.document.querySelector('[aria-label^="Turno estimado por registro"]')) throw Error('Indicador de turno incorrecto');
    if (!app.document.querySelector('[aria-label="Abundancia: 60"]')) throw Error('Observación de abundancia incorrecta');
    if (!app.document.querySelector('[aria-label="Próximo Ciclo Elemental, coste estimado en BC: 50"]')) throw Error('Coste de ciclo incorrecto');
    if (!app.document.querySelector('[aria-label^="Luminiscencia: observado este turno"]')) throw Error('Luminiscencia no detectada');
    if (!app.document.querySelector('.class-rune.is-last.is-active')?.getAttribute('aria-label').includes('Fuego')) throw Error('Última runa de fuego no marcada');
    if (!rows[1].textContent.includes('-1.234 PdV')) throw Error('Texto original perdido');
    if (!rows[0].querySelector('[aria-label="Crítico"]')) throw Error('Falta el indicador de crítico');
    if (rows[4].querySelector('[aria-label="Espalda"]')) throw Error('No se retiró el indicador de espalda');
    const uploader = app.document.getElementById('combat-spell-import');
    const transfer = new app.DataTransfer();
    transfer.items.add(new app.File([JSON.stringify({version: 1, hechizos: {'Piratería': 'Descripción de prueba'}})], 'hechizos.json', {type: 'application/json'}));
    uploader.files = transfer.files;
    uploader.dispatchEvent(new app.Event('change'));
    await new Promise(resolve => setTimeout(resolve, 100));
    if (rows[0].title !== 'Descripción de prueba') throw Error('Descripción de hechizo no cargada');
    if (!app.document.getElementById('list-allies').textContent.includes('Personaje')) throw Error('La clase no fue identificada como aliada');
    const filter = app.document.getElementById('combat-log-type');
    filter.value = 'damage'; filter.dispatchEvent(new app.Event('change'));
    if (rows.filter(x => !x.hidden).length !== 2 || rows[1].hidden || rows[4].hidden) throw Error('Filtro incorrecto');
    filter.value = 'all'; filter.dispatchEvent(new app.Event('change'));
    content += '12:00:05,000 - [Información (combate)] Personaje lanza el hechizo Incom';
    await app.parseFile();
    if (list.querySelectorAll('.combat-log-event').length !== 15) throw Error('Se mostró una línea incompleta');
    content += 'pleto.\n';
    await app.parseFile();
    if (list.querySelectorAll('.combat-log-event').length !== 16 || !list.textContent.includes('Incompleto.')) throw Error('Línea dividida perdida');
    const spanish = app.decodeLogLine(new Uint8Array([73, 110, 102, 111, 114, 109, 97, 99, 105, 243, 110]));
    if (spanish !== 'Información') throw Error('Codificación Windows-1252 incorrecta');
    const utf8 = app.decodeLogLine(new TextEncoder().encode('Información'));
    if (utf8 !== 'Información') throw Error('Codificación UTF-8 incorrecta');
    result.textContent = 'PRUEBA CORRECTA';
  } catch (error) { result.textContent = 'PRUEBA FALLIDA: ' + error.message; }
};
</script>
