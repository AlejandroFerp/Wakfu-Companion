<!doctype html><meta charset="utf-8"><title>Prueba de combate personal</title>
<script>localStorage.removeItem('wakfu_fight_history');localStorage.removeItem('wakfu_live_combat_state');</script>
<iframe id="app" src="../public/index.html" width="1200" height="800"></iframe>
<p id="result">Comprobando...</p>
<script>
document.getElementById('app').onload = async () => {
  const app = document.getElementById('app').contentWindow;
  const result = document.getElementById('result');
  try {
    app.saveFileHandleToDB = async () => {};
    let content = '';
    const handle = {name:'wakfu_chat.log', async getFile(){return new File([content], 'wakfu_chat.log');}};
    const drop = new app.Event('drop',{bubbles:true,cancelable:true});
    Object.defineProperty(drop,'dataTransfer',{value:{items:[{kind:'file',async getAsFileSystemHandle(){return handle;}}]}});
    app.document.getElementById('drop-zone').dispatchEvent(drop);
    await new Promise(resolve=>setTimeout(resolve,200));
    content = '12:00:00,000 - [Información (combate)] Jugador lanza el hechizo Piratería.\n12:00:01,000 - [Información (combate)] Objetivo: -100 PdV (fuego)\n';
    await app.parseFile();
    const row = app.document.querySelector('.player-block[data-name="Jugador"] .player-row');
    if (!row) throw Error('No apareció el personaje');
    row.click();
    let block = app.document.querySelector('.player-block[data-name="Jugador"]');
    if (!block.querySelector('.spell-row')?.textContent.includes('Piratería')) throw Error('Falta el total del hechizo');
    if (block.querySelector('.personal-turn-button, .spell-hit-summary, .personal-combat-detail')) throw Error('El resumen contiene información de Details');
    const detailsTab = app.document.getElementById('tab-details');
    const details = app.document.getElementById('combat-details');
    detailsTab.click();
    if (details.hidden || !new URL(details.src).pathname.endsWith('/combat-details.html')) throw Error('Details no abrió el informe');
    app.document.getElementById('tab-damage').click();
    if (!details.hidden || !app.document.getElementById('tab-damage').classList.contains('active')) throw Error('No se pudo volver al resumen');
    content += '12:00:01,400 - [Información (combate)] 30 segundos devueltos para el siguiente turno.\n12:00:01,500 - [Información (combate)] Jugador lanza el hechizo Steamerator.\n';
    await app.parseFile();
    content += '12:00:02,000 - [Información (combate)] Jugador lanza el hechizo Piratería.\n12:00:03,000 - [Información (combate)] Objetivo: -300 PdV (fuego)\n12:00:03,100 - [Información (combate)] Jugador: -2 PM\n';
    await app.parseFile();
    content += '12:00:03,150 - [Información (combate)] 25 segundos devueltos para el siguiente turno.\n12:00:03,200 - [Información (combate)] Jugador lanza el hechizo Piratería.\n12:00:03,300 - [Información (combate)] Objetivo: -200 PdV (fuego)\n';
    await app.parseFile();
    content += '12:00:04,000 - [Información (combate)] Combate terminado.\n';
    await app.parseFile();
    const history = JSON.parse(app.localStorage.getItem('wakfu_fight_history'));
    const fight = history[0];
    if (fight.personalTurnDamage.Jugador !== 600 || fight.personalDamageByTurn.Jugador[2] !== 300 || fight.personalDamageByTurn.Jugador[3] !== 200) throw Error('No se guardó el detalle por turno');
    if (!fight.personalEvents.Jugador.some(event => event.spell === 'Steamerator')) throw Error('Se perdió el lanzamiento sin daño');
    const stats = Object.values(fight.damage.Jugador.spells)[0].hitStats;
    if (stats.count !== 3 || stats.min !== 100 || stats.max !== 300) throw Error('No se conservaron las estadísticas de impactos');
    app.document.getElementById('btn-hist-0').click();
    const historical = app.document.querySelector('.player-block[data-name="Jugador"]');
    if (!historical?.querySelector('.spell-row')?.textContent.includes('600')) throw Error('No se muestra el resumen histórico');
    result.textContent='PRUEBA CORRECTA';
  } catch(error) {result.textContent='PRUEBA FALLIDA: '+error.message;}
};
</script>
