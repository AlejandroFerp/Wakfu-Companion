<!doctype html><meta charset="utf-8"><title>Prueba de señales del selotrop</title>
<script>localStorage.removeItem('wakfu_fight_history');localStorage.removeItem('wakfu_live_combat_state');localStorage.removeItem('wakfu_overrides');</script>
<iframe id="app" src="../public/index.html" width="1100" height="700"></iframe><p id="result">Comprobando...</p>
<script>
document.getElementById('app').onload=async()=>{
  const app=document.getElementById('app').contentWindow,result=document.getElementById('result');
  try{
    app.saveFileHandleToDB=async()=>{};let content='';
    const handle={name:'wakfu_chat.log',async getFile(){return new File([content],'wakfu_chat.log');}};
    const drop=new app.Event('drop',{bubbles:true,cancelable:true});
    Object.defineProperty(drop,'dataTransfer',{value:{items:[{kind:'file',async getAsFileSystemHandle(){return handle;}}]}});
    app.document.getElementById('drop-zone').dispatchEvent(drop);await new Promise(r=>setTimeout(r,200));
    const d=app.document, selector=d.getElementById('class-selector');selector.value='eliotrope';selector.dispatchEvent(new app.Event('change'));
    if(d.getElementById('selotrop-panel').hidden || !d.getElementById('hyper-class-panel').hidden) throw Error('No se seleccionó el panel del selotrop');
    content=['12:00:00,000 - [Información (combate)] Uno lanza el hechizo Wakmeha.',
      '12:00:01,000 - [Información (combate)] Uno: Portal Celestial - Contador (+3 niv.)',
      '12:00:02,000 - [Información (combate)] Uno: Don Celestial (+1 niv.) (Portal Celestial)',
      '12:00:03,000 - [Información (combate)] Dos lanza el hechizo Wakmeha.',
      '12:00:04,000 - [Información (combate)] Dos: Portal Celestial - Contador (+2 niv.)',
      '12:00:05,000 - [Información (combate)] Dos: 2 PA (Don Celestial)',
      '12:00:05,500 - [Información (combate)] Tres: Don Celestial (+2 niv.) (Portal Celestial)',''].join('\n');
    await app.parseFile();
    const choose=d.getElementById('selotrop-character'),details=d.getElementById('selotrop-observations');
    choose.value='Uno';choose.dispatchEvent(new app.Event('change'));
    if(!details.textContent.includes('+3 niv.') || !details.textContent.includes('+1 niv.')) throw Error('Faltan las señales del primer personaje');
    choose.value='Dos';choose.dispatchEvent(new app.Event('change'));
    if(!details.textContent.includes('+2 niv.') || !details.textContent.includes('2 PA') || details.textContent.includes('+3 niv.')) throw Error('Se mezclaron las señales de dos personajes');
    choose.value='Tres';choose.dispatchEvent(new app.Event('change'));
    if(!details.textContent.includes('+2 niv.')) throw Error('No se reconoció una señal sin lanzamiento previo');
    choose.value='Dos';choose.dispatchEvent(new app.Event('change'));
    content += "12:00:06,000 - [Información (combate)] Dos: ya no se encuentra bajo el estado 'Don Celestial'\n";
    await app.parseFile();
    if(!details.textContent.includes('retirado')) throw Error('No se reflejó la retirada observada');
    app.performReset();
    if(details.textContent.includes('+2 niv.') || details.textContent.includes('2 PA')) throw Error('No se reiniciaron las observaciones');
    if([...choose.options].some(option=>option.value==='Tres')) throw Error('Una señal antigua siguió como personaje detectado');
    selector.value='huppermage';selector.dispatchEvent(new app.Event('change'));
    if(!d.getElementById('selotrop-panel').hidden || d.getElementById('hyper-class-panel').hidden) throw Error('No se recuperó el panel del hipermago');
    result.textContent='PRUEBA CORRECTA';
  }catch(error){result.textContent='PRUEBA FALLIDA: '+error.message;}
};
</script>
