<!doctype html><meta charset="utf-8"><title>Prueba de eventos repetidos</title>
<script>localStorage.removeItem('wakfu_fight_history'); localStorage.removeItem('wakfu_live_combat_state');</script>
<iframe id="app" src="../public/index.html" width="1000" height="600"></iframe>
<p id="result">Comprobando...</p>
<script>
document.getElementById('app').onload = async () => {
  const app = document.getElementById('app').contentWindow;
  const result = document.getElementById('result');
  try {
    app.localStorage.removeItem('wakfu_fight_history');
    app.saveFileHandleToDB = async () => {};
    let content = '';
    const handle = {name: 'wakfu_chat.log', async getFile() { return new File([content], 'wakfu_chat.log'); }};
    const event = new app.Event('drop', {bubbles: true, cancelable: true});
    Object.defineProperty(event, 'dataTransfer', {value: {items: [{kind: 'file', async getAsFileSystemHandle() { return handle; }}]}});
    app.document.getElementById('drop-zone').dispatchEvent(event);
    await new Promise(resolve => setTimeout(resolve, 200));
    const hit = '12:00:01,000 - [Información (combate)] Objetivo: -100 PdV (fuego)\n';
    content = '12:00:00,000 - [Información (combate)] Jugador lanza el hechizo Piratería.\n' + hit + hit + '12:00:02,000 - [Información (combate)] Combate terminado.\n';
    await app.parseFile();
    const history = JSON.parse(app.localStorage.getItem('wakfu_fight_history'));
    if (history[0].damage.Jugador.total !== 200) throw Error('No se sumaron los dos eventos idénticos');
    const events = [...app.document.querySelectorAll('.combat-log-event')].filter(x => x.textContent.includes('-100 PdV'));
    if (events.length !== 2) throw Error('El registro cronológico no conservó ambos eventos');
    await app.parseFile();
    const again = JSON.parse(app.localStorage.getItem('wakfu_fight_history'));
    if (again[0].damage.Jugador.total !== 200 || again.length !== 1) throw Error('Se procesó dos veces la misma lectura');
    result.textContent = 'PRUEBA CORRECTA';
  } catch (error) { result.textContent = 'PRUEBA FALLIDA: ' + error.message; }
};
</script>
