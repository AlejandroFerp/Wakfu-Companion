<!doctype html><meta charset="utf-8"><title>Prueba de clase elegida</title>
<script>localStorage.setItem('wakfu_class_tracker','eliotrope');</script>
<iframe id="app" src="../public/index.html" width="1000" height="600"></iframe><p id="result">Comprobando...</p>
<script>
document.getElementById('app').onload=()=>{
  const app=document.getElementById('app').contentWindow,result=document.getElementById('result');
  try {
    const d=app.document,select=d.getElementById('class-selector');
    if(select.value!=='eliotrope' || d.getElementById('selotrop-panel').hidden) throw Error('No se restauró la clase elegida');
    select.value='huppermage';select.dispatchEvent(new app.Event('change'));
    if(app.localStorage.getItem('wakfu_class_tracker')!=='huppermage' || d.getElementById('hyper-class-panel').hidden) throw Error('No se guardó el cambio de clase');
    result.textContent='PRUEBA CORRECTA';
  }catch(error){result.textContent='PRUEBA FALLIDA: '+error.message;}
};
</script>
