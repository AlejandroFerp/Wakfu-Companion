name: Publish Windows executable
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'desktop.go'
      - 'go.mod'
      - 'public/**'
      - '.github/workflows/desktop.yml'
permissions:
  contents: write
concurrency:
  group: wakfu-companion-desktop-release
  cancel-in-progress: true
jobs:
  windows:
    if: github.ref == 'refs/heads/master'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Package frontend
        shell: pwsh
        run: |
          python -c "from pathlib import Path; import zipfile; z=zipfile.ZipFile('desktop-assets.zip','w',zipfile.ZIP_DEFLATED,compresslevel=4); [z.write(p,p.as_posix()) for p in Path('public').rglob('*') if p.is_file()]; z.close()"
      - name: Build executable
        run: go build -trimpath -ldflags="-s -w" -o WakfuCompanion.exe desktop.go
      - name: Publish desktop release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'desktop-' + $env:GITHUB_SHA.Substring(0, 12)
          $title = 'Wakfu Companion para Windows · ' + $env:GITHUB_SHA.Substring(0, 7)
          $notes = "Versión de escritorio para Windows. Requiere Microsoft Edge. Código: $env:GITHUB_SHA."
          gh release view $tag --json tagName --jq .tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag WakfuCompanion.exe --clobber
          } else {
            gh release create $tag WakfuCompanion.exe --target $env:GITHUB_SHA --title $title --notes $notes --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo publicar el ejecutable.' }
